<title>Sesión IA Aplicada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: agenda rail with live session clock on the left, one block per stage on the right; stacks on phones */
:root{
  --bg:#F5F7FB; --surface:#FFFFFF; --ink:#16213A; --muted:#5A6580; --line:#DCE2EE;
  --navy:#0F1E3D; --accent:#2F62C9; --gold:#B88A12; --soft:#EAF0FA; --ok:#1F7A4D; --warn:#B4541A;
  --on-navy:#E8EEF9; --on-navy-muted:#9FB0D2;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1222; --surface:#121C33; --ink:#E6ECF7; --muted:#9AA8C4; --line:#24324F;
  --navy:#0A1630; --accent:#7EA6F2; --gold:#E2B84A; --soft:#17233F; --ok:#5CC48E; --warn:#F09A5E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1222; --surface:#121C33; --ink:#E6ECF7; --muted:#9AA8C4; --line:#24324F;
  --navy:#0A1630; --accent:#7EA6F2; --gold:#E2B84A; --soft:#17233F; --ok:#5CC48E; --warn:#F09A5E; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
.app{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100%}
aside{background:var(--navy);color:var(--on-navy);padding:24px 18px;display:flex;flex-direction:column;gap:18px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;letter-spacing:.02em}
.brand img{width:36px;height:36px;border-radius:6px}
.clock{border:1px solid #2A3D66;border-radius:10px;padding:14px}
.clock .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--on-navy-muted)}
.clock .t{font-family:var(--mono);font-size:34px;font-variant-numeric:tabular-nums;line-height:1.1;color:#fff}
.clock .sub{font-size:13px;color:var(--on-navy-muted);min-height:20px}
.bar{height:6px;background:#22345A;border-radius:3px;overflow:hidden;margin-block:10px}
.bar i{display:block;height:100%;width:0;background:#E2B84A;transition:width .4s}
.ctrls{display:flex;gap:6px;flex-wrap:wrap}
.ctrls button{flex:1;font:600 13px var(--body);padding:8px 6px;border-radius:6px;border:1px solid #3A5080;background:transparent;color:#fff;cursor:pointer}
.ctrls button.primary{background:#E2B84A;border-color:#E2B84A;color:#0F1E3D}
.ctrls button:focus-visible,nav button:focus-visible,.btn:focus-visible{outline:2px solid #E2B84A;outline-offset:2px}
nav{display:flex;flex-direction:column;gap:2px}
nav button{display:grid;grid-template-columns:62px 1fr;gap:8px;text-align:left;background:transparent;border:0;border-radius:6px;padding:8px;color:var(--on-navy);font:15px var(--body);cursor:pointer}
nav button .tm{font-family:var(--mono);font-size:12px;color:var(--on-navy-muted);padding-top:2px;font-variant-numeric:tabular-nums}
nav button:hover{background:#17284A}
nav button.cur{background:#1C3060}
nav button.live .tm{color:#E2B84A}
nav button.live::after{content:"";}
nav button.done .ttl{color:var(--on-navy-muted);text-decoration:line-through;text-decoration-color:#4A5F8E}
.credit{margin-top:auto;font-size:12px;color:var(--on-navy-muted)}
main{padding-block:36px 24px;padding-inline:clamp(16px,4vw,56px);min-width:0;display:flex;flex-direction:column;gap:20px}
.slide{max-width:900px;width:100%;display:flex;flex-direction:column;gap:18px}
.eyebrow{font:600 12px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);display:flex;gap:12px;flex-wrap:wrap}
.eyebrow .dur{color:var(--muted)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,4.2vw,46px);line-height:1.08;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:21px;margin:0}
p{margin:0;max-width:68ch}
.lead{font-size:20px;color:var(--muted);max-width:60ch}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.box h3{margin:0;font:700 13px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
ul.pts{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.notes{background:var(--soft);border-radius:10px;padding:14px 18px;font-size:15px;color:var(--ink)}
.notes b{color:var(--accent)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px;background:var(--surface)}
th{background:var(--navy);color:#fff;text-align:left;padding:9px 10px;font-weight:600;font-size:13px}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.pill{display:inline-block;font:600 12px var(--body);padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--accent)}
.pill.g{color:var(--gold)}
.btn{font:600 14px var(--body);padding:9px 14px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.pager{display:flex;gap:10px;justify-content:space-between;max-width:900px;margin-top:auto;padding-top:8px}
.prompt{font-family:var(--mono);font-size:13.5px;line-height:1.6;white-space:pre-wrap;background:var(--navy);color:#E8EEF9;border-radius:10px;padding:16px;margin:0;overflow-x:auto}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font:600 13px var(--body);color:var(--muted)}
.form input{font:15px var(--body);padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.form .full{grid-column:1/-1}
.levels{display:flex;flex-direction:column;gap:8px}
.lv{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.lv .n{font-family:var(--display);font-weight:700;font-size:26px;color:var(--accent);line-height:1}
.lv.dim{opacity:.6}
.lv.target{border-color:var(--accent)}
.check{display:flex;flex-direction:column;gap:8px}
.check label{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
.check input{margin-top:4px;accent-color:var(--accent);width:18px;height:18px}
.weeks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.wk{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.wk b{font-family:var(--display);font-size:18px}
.wk small{color:var(--muted);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:11px}
.cover{background:var(--navy);color:var(--on-navy);border-radius:14px;padding:clamp(22px,4vw,44px);display:flex;flex-direction:column;gap:18px}
.cover img{width:64px;height:64px;border-radius:8px}
.cover h1{color:#fff}
.cover .lead{color:var(--on-navy-muted)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{border:1px solid #2A3D66;border-radius:8px;padding:12px}
.stat b{display:block;font-family:var(--display);font-size:24px;color:#E2B84A}
.stat span{font-size:13px;color:var(--on-navy-muted)}
.timeline{display:flex;height:34px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.timeline div{display:flex;align-items:center;justify-content:center;font:600 11px var(--mono);color:#fff;white-space:nowrap;overflow:hidden}
.qa{display:flex;flex-direction:column;gap:8px}
.qa details{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.qa summary{cursor:pointer;font-weight:600}
.qa p{margin-top:8px;color:var(--muted)}
.foot{font-size:12px;color:var(--muted);text-align:right;max-width:900px}
.kbd{font-family:var(--mono);font-size:12px;color:var(--muted)}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  aside{position:static;height:auto}
  nav{flex-direction:row;overflow-x:auto;gap:6px}
  nav button{grid-template-columns:1fr;min-width:130px;gap:2px}
  .grid2,.form,.weeks,.stats{grid-template-columns:1fr 1fr}
}
@media (max-width:520px){.grid2,.form,.weeks,.stats{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const COLORS=["#3B5B9A","#2F62C9","#2A7F8E","#1F7A4D","#6B4FB0","#B4541A","#B88A12","#8A3B5E"];

const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

const R={
inicio:()=>`<div class="cover">
  <img src="${LOGO}" alt="OctyRG">
  <div class="eyebrow" style="color:#E2B84A">Coaching · Consultora de capacitación empresarial</div>
  <h1>De instrucciones sueltas a un sistema de trabajo con IA</h1>
  <p class="lead">Una sesión de 2 horas para pasar de pedirle cosas a la IA a trabajar con ella con contexto, estructura e iteración.</p>
  <div class="stats">
    <div class="stat"><b>120 min</b><span>incluye 15 de preguntas</span></div>
    <div class="stat"><b>4 niveles</b><span>de prompt a flujo encadenado</span></div>
    <div class="stat"><b>ChatGPT Plus</b><span>herramienta central</span></div>
    <div class="stat"><b>30 días</b><span>plan de adopción</span></div>
  </div></div>
  <div class="timeline" aria-label="Distribución del tiempo">${B.slice(1).map((b,i)=>`<div style="flex:${b.e-b.s};background:${COLORS[i]}" title="${b.t}">${b.e-b.s}′</div>`).join("")}</div>
  <p class="kbd">Pulsa “Iniciar” en el reloj al arrancar la sesión: el bloque en curso se resalta solo.</p>`,

diag:b=>`${head(b)}<h1>¿Dónde están hoy?</h1>
  <p class="lead">Entender su punto de partida y elegir las tareas reales con las que vamos a practicar.</p>
  <div class="grid2">
   <div class="box"><h3>Preguntas clave</h3><ul class="pts">
     <li>¿Qué herramientas de IA usan y qué plan pagan? (Go vs. Plus cambia lo que podemos hacer)</li>
     <li>¿Para qué la usan hoy y qué resultado les decepcionó?</li>
     <li>¿Cuáles son las 3 tareas que más tiempo les consumen?</li></ul></div>
   <div class="box"><h3>Sus 3 tareas de práctica</h3>
     <div class="form">
      <label class="full">Tarea 1<input id="t1" placeholder="Ej. diseñar la agenda de un taller"></label>
      <label class="full">Tarea 2<input id="t2" placeholder="Ej. redactar propuestas para prospectos"></label>
      <label class="full">Tarea 3<input id="t3" placeholder="Ej. crear evaluaciones para participantes"></label>
     </div></div>
  </div>
  <div class="notes"><b>Nota para el coach:</b> si pagan Go, menciónalo ahora. Varias funciones de los niveles 3 y 4 dependen de Plus.</div>`,

mental:b=>`${head(b)}<h1>La IA es un colaborador junior sin contexto</h1>
  <p class="lead">Si no le explicas quién es el cliente, cuál es el objetivo y cómo se ve un buen resultado, adivina.</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn on" data-v="a" id="va">Prompt suelto</button><button class="btn" data-v="b" id="vb">Prompt estructurado</button></div>
  <pre class="prompt" id="cmp"></pre>
  <div class="grid2">
   <div class="box"><h3>Errores comunes</h3><ul class="pts"><li>Una sola línea sin contexto</li><li>Aceptar la primera respuesta</li><li>Empezar de cero en cada chat</li><li>No verificar datos y cifras</li></ul></div>
   <div class="box"><h3>Modo rápido vs. razonamiento</h3><ul class="pts"><li><b>Rápido:</b> redactar, resumir, reformular</li><li><b>Razonamiento:</b> diagnosticar, diseñar un programa, comparar opciones</li></ul></div>
  </div>
  <div class="notes"><b>Dinámica:</b> corre los dos prompts en vivo en su ChatGPT y que comparen el resultado. El contraste convence más que la explicación.</div>`,

practica:b=>`${head(b)}<h1>Niveles 1 y 2: estructura e iteración</h1>
  <p class="lead">Ellos escriben, tú corriges. Usen una de sus tareas reales y el marco Rol · Contexto · Tarea · Formato · Criterios.</p>
  <div class="box"><h3>Constructor de prompt</h3>
   <div class="form">
    <label>Rol<input id="pRol" value="diseñador instruccional experto en capacitación empresarial"></label>
    <label>Público<input id="pPub" value="mandos medios de una empresa manufacturera"></label>
    <label class="full">Contexto<input id="pCtx" value="Somos una consultora de capacitación. El cliente tiene alta rotación de supervisores."></label>
    <label>Entregable<input id="pTar" value="la agenda de un taller de liderazgo"></label>
    <label>Duración<input id="pDur" value="8 horas"></label>
    <label class="full">Formato<input id="pFmt" value="tabla con horario, actividad, objetivo y material"></label>
   </div>
   <pre class="prompt" id="pOut"></pre>
   <div><button class="btn" id="copyP">Copiar prompt</button> <span class="kbd" id="copyMsg"></span></div>
  </div>
  <div class="box"><h3>Nivel 2: preguntas de iteración</h3><ul class="pts">
   <li>“Dame tres alternativas con enfoques distintos.”</li>
   <li>“Critica tu propia propuesta como lo haría un director de RH escéptico.”</li>
   <li>“Ajusta las dinámicas para un grupo de 25 personas con poco tiempo.”</li>
   <li>“Antes de responder, hazme las preguntas que necesites.”</li></ul></div>`,

n3:b=>`${head(b)}<h1>Nivel 3: que la IA ya los conozca</h1>
  <p class="lead">Salen de la sesión con un asistente configurado que trabaja con su metodología y su tono.</p>
  <div class="levels">
   <div class="lv"><div class="n">1</div><div><b>Instrucciones personalizadas</b><br>Quiénes son, a quién atienden, tono y formato preferido. Aplica a todas las conversaciones.</div></div>
   <div class="lv"><div class="n">2</div><div><b>Un Proyecto por línea de servicio</b><br>Carpeta con chats y archivos propios: metodología, propuesta modelo, catálogo de cursos.</div></div>
   <div class="lv"><div class="n">3</div><div><b>GPT “Asistente de diseño instruccional”</b><br>Instrucciones fijas + archivos de referencia. Lo usan los dos socios igual.</div></div>
  </div>
  <div class="box"><h3>Instrucciones base del GPT (para adaptar en vivo)</h3>
  <pre class="prompt">Eres el asistente de diseño instruccional de [nombre de la consultora].
Atendemos empresas mexicanas en temas comerciales, habilidades gerenciales y desarrollo organizacional.
Siempre: objetivos de aprendizaje medibles, dinámicas participativas, evaluación al cierre.
Formato: tablas claras, español de México, tono profesional y cercano.
Usa los archivos adjuntos como estándar de calidad.
Si falta información del cliente, pregunta antes de proponer.</pre></div>`,

n4:b=>`${head(b)}<h1>Nivel 4: flujos encadenados</h1>
  <p class="lead">Un trabajo grande dividido en pasos conectados. Cada salida se vuelve la entrada del siguiente paso.</p>
  <div class="tbl"><table><thead><tr><th>Paso</th><th>Qué se le pide a la IA</th><th>Herramienta</th></tr></thead><tbody>
   <tr><td><b>1. Investigar</b></td><td>Contexto de la industria y retos típicos del cliente</td><td><span class="pill">Investigación profunda</span></td></tr>
   <tr><td><b>2. Diagnosticar</b></td><td>Necesidades de capacitación a partir de lo que dijo el cliente</td><td><span class="pill">Razonamiento</span></td></tr>
   <tr><td><b>3. Proponer</b></td><td>Propuesta comercial con su formato</td><td><span class="pill">GPT propio</span></td></tr>
   <tr><td><b>4. Diseñar</b></td><td>Programa, agenda y dinámicas</td><td><span class="pill">Proyecto</span></td></tr>
   <tr><td><b>5. Material</b></td><td>Guía del participante y cuestionario</td><td><span class="pill g">NotebookLM</span></td></tr>
  </tbody></table></div>
  <div class="notes"><b>Demostración:</b> usa un cliente ficticio de punta a punta. En NotebookLM, sube un manual suyo y genera guía, cuestionario y resumen en audio.</div>
  <div class="box"><h3>Horizonte (nivel 5, fuera de esta sesión)</h3><p>Conectores, agentes y automatizaciones. Solo se menciona como siguiente etapa.</p></div>`,

resp:b=>`${head(b)}<h1>Uso responsable</h1>
  <p class="lead">Trabajan con información de sus clientes. Cuatro reglas antes de entregar cualquier cosa.</p>
  <div class="check">
   <label><input type="checkbox" id="c1"><span><b>Privacidad configurada.</b> Desactivar el uso de conversaciones para entrenar el modelo, o usar el plan Business.</span></label>
   <label><input type="checkbox" id="c2"><span><b>Datos sensibles fuera.</b> Nombres de personas, cifras internas y datos personales se anonimizan.</span></label>
   <label><input type="checkbox" id="c3"><span><b>Verificar.</b> Cifras, citas, leyes y referencias se comprueban en la fuente original.</span></label>
   <label><input type="checkbox" id="c4"><span><b>Revisión humana.</b> Nada sale al cliente sin que uno de los socios lo lea completo.</span></label>
  </div>`,

cierre:b=>`${head(b)}<h1>Plan de 30 días con ChatGPT</h1>
  <p class="lead">Lo que pase en las próximas cuatro semanas decide si esto se vuelve hábito.</p>
  <div class="weeks">
   <div class="wk"><small>Semana 1</small><b>Configurar</b><span>Instrucciones personalizadas, privacidad y biblioteca con 5 plantillas de prompts.</span></div>
   <div class="wk"><small>Semana 2</small><b>Contexto</b><span>Un Proyecto por línea de servicio o cliente clave. Afinar el GPT.</span></div>
   <div class="wk"><small>Semana 3</small><b>Entregable real</b><span>Un curso o propuesta completo con el flujo encadenado. Medir tiempo.</span></div>
   <div class="wk"><small>Semana 4</small><b>Revisión</b><span>Seguimiento: qué funcionó, qué ajustar, ¿NotebookLM o plan Business?</span></div>
  </div>
  <div class="grid2">
   <div class="box"><h3>Herramientas recomendadas</h3><div class="tbl"><table><tbody>
    <tr><td><b>ChatGPT Plus</b></td><td>US$20/mes · central</td></tr>
    <tr><td><b>ChatGPT Business</b></td><td>US$20–25 por usuario · mín. 2</td></tr>
    <tr><td><b>NotebookLM</b></td><td>Gratis · material</td></tr></tbody></table></div></div>
   <div class="box"><h3>Compromisos de hoy</h3><div class="form">
    <label class="full">Primera tarea a resolver con IA<input id="k1" placeholder="Ej. propuesta para el cliente X"></label>

  <div class="notes"><b>Cierre:</b> lo que aprendieron también es contenido que pueden ofrecer a sus propios clientes como nueva línea de servicio.</div>`,

qa:b=>`${head(b)}<h1>Preguntas y respuestas</h1>
  <p class="lead">Espacio abierto. Estas son las dudas que suelen aparecer, por si hace falta arrancar la conversación.</p>
  <div class="qa">
   <details><summary>¿ChatGPT, Gemini o Claude?</summary><p>Para ustedes, ChatGPT Plus como herramienta central. Gemini conviene si trabajan todo en Google; Claude, como segunda opinión en redacción larga.</p></details>

   <details><summary>¿Cómo evito que invente datos?</summary><p>Pedirle fuentes, verificar cifras, y para su propio material usar NotebookLM, que responde con base en los documentos que suben.</p></details>
   <details><summary>¿Cuánto tiempo tarda en notarse el beneficio?</summary><p>Con el plan de 30 días, la semana 3 ya debería mostrar ahorro medible en un entregable real.</p></details>
   <details><summary>¿Podemos enseñar esto a nuestros clientes?</summary><p>Sí. Lo que aprendan aquí puede convertirse en un taller propio de IA aplicada para sus clientes.</p></details>
  </div>`
};

const CMP={a:"Hazme un taller de liderazgo.",
b:`Actúa como diseñador instruccional experto en capacitación empresarial.
Contexto: somos una consultora en México. El cliente es una manufacturera con 40 supervisores
recién ascendidos y alta rotación de personal.
Tarea: diseña la agenda de un taller de liderazgo de 8 horas.
Formato: tabla con horario, actividad, objetivo y material.
Criterios: objetivos medibles, al menos 3 dinámicas prácticas y una evaluación al cierre.
Antes de responder, hazme las preguntas que necesites.`};

let cur=0, startAt=null, accum=0, timer=null;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const nav=document.getElementById("nav"), slide=document.getElementById("slide");

function buildNav(){
  nav.innerHTML=B.map((b,i)=>`<button data-i="${i}"><span class="tm">${i?`${fmt(b.s)}–${fmt(b.e)}`:"—"}</span><span class="ttl">${b.t}</span></button>`).join("");
  nav.querySelectorAll("button").forEach(x=>x.onclick=()=>go(+x.dataset.i));
}
function go(i){
  cur=Math.max(0,Math.min(B.length-1,i));
  slide.innerHTML=R[B[cur].id](B[cur]);
  wire();
  nav.querySelectorAll("button").forEach((x,j)=>x.classList.toggle("cur",j===cur));
  document.getElementById("prev").disabled=cur===0;
  document.getElementById("next").disabled=cur===B.length-1;
  store.set("slide",cur);
  window.scrollTo({top:0});
}
function wire(){
  slide.querySelectorAll("input").forEach(inp=>{
    const k="f_"+inp.id, v=store.get(k);
    if(inp.type==="checkbox"){ if(v==="1") inp.checked=true; inp.onchange=()=>store.set(k,inp.checked?"1":"0"); }
    else { if(v!==null) inp.value=v; inp.addEventListener("input",()=>{store.set(k,inp.value);buildPrompt();}); }
  });
  const cmp=document.getElementById("cmp");
  if(cmp){const set=v=>{cmp.textContent=CMP[v];document.getElementById("va").classList.toggle("on",v==="a");document.getElementById("vb").classList.toggle("on",v==="b");};
    set("a");document.getElementById("va").onclick=()=>set("a");document.getElementById("vb").onclick=()=>set("b");}
  buildPrompt();
  const cp=document.getElementById("copyP");
  if(cp) cp.onclick=()=>{const t=document.getElementById("pOut").textContent,m=document.getElementById("copyMsg");
    navigator.clipboard.writeText(t).then(()=>m.textContent="Copiado").catch(()=>{const r=document.createRange();r.selectNodeContents(document.getElementById("pOut"));const s=getSelection();s.removeAllRanges();s.addRange(r);m.textContent="Texto seleccionado: cópialo con Ctrl+C";});};
}
function buildPrompt(){
  const o=document.getElementById("pOut"); if(!o) return;
  const v=id=>document.getElementById(id).value.trim();
  o.textContent=`Actúa como ${v("pRol")}.
Contexto: ${v("pCtx")}
Tarea: diseña ${v("pTar")} para ${v("pPub")}, con duración de ${v("pDur")}.
Formato: ${v("pFmt")}, en español de México.
Criterios: objetivos medibles, dinámicas participativas y evaluación al cierre.
Antes de responder, hazme las preguntas que necesites.`;
}
function elapsedMs(){return accum+(startAt?Date.now()-startAt:0)}
function tick(){
  const ms=elapsedMs(), min=ms/60000, sec=Math.floor(ms/1000);
  document.getElementById("elapsed").textContent=`${fmt(Math.floor(sec/60))}:${fmt(sec%60)}`;
  document.getElementById("prog").style.width=Math.min(100,min/120*100)+"%";
  const live=B.findIndex((b,i)=>i>0&&min>=b.s&&min<b.e);
  nav.querySelectorAll("button").forEach((x,j)=>{x.classList.toggle("live",j===live);x.classList.toggle("done",j>0&&min>=B[j].e);});
  const st=document.getElementById("status");
  if(!startAt&&!accum) st.textContent="Sin iniciar · 120 min planeados";
  else if(live>0){const left=Math.ceil(B[live].e-min);st.textContent=`${B[live].t} · quedan ${left} min${startAt?"":" (en pausa)"}`;}
  else if(min>=120) st.textContent="Tiempo cumplido";
}
document.getElementById("startBtn").onclick=e=>{
  if(startAt){accum+=Date.now()-startAt;startAt=null;e.target.textContent="Reanudar";}
  else{startAt=Date.now();e.target.textContent="Pausar";if(!timer)timer=setInterval(tick,1000);if(cur===0)go(1);}
  tick();
};
document.getElementById("resetBtn").onclick=()=>{startAt=null;accum=0;document.getElementById("startBtn").textContent="Iniciar";tick();};
document.getElementById("prev").onclick=()=>go(cur-1);
document.getElementById("next").onclick=()=>go(cur+1);
document.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;if(e.key==="ArrowRight")go(cur+1);if(e.key==="ArrowLeft")go(cur-1);});
buildNav();
const saved=parseInt(store.get("slide"),10);
go(isNaN(saved)?0:saved);
tick();
</script>

</body></html>
